name: Weekly health check

# Catches problems that appear without any code change: new security
# advisories (also for dependencies Dependabot cannot update) and an
# unreachable live site. A failed run triggers a GitHub email notification.
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Audit app dependencies
        run: npm audit --audit-level=moderate

      - name: Audit Firestore rules test dependencies
        working-directory: firestore-tests
        run: npm audit --audit-level=moderate

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  live-site:
    runs-on: ubuntu-latest
    env:
      SITE: https://join-aghirculesei.pages.dev
    steps:
      - name: Pages respond and serve the app
        run: |
          for path in / /login /board /legal-notice; do
            body=$(curl --fail --silent --show-error --retry 3 --retry-delay 10 "$SITE$path")
            echo "$body" | grep -q '<app-root' || { echo "::error::$path does not serve the app"; exit 1; }
            echo "OK $path"
          done

  angular-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Angular version is still supported
        run: |
          major=$(jq -r '.dependencies["@angular/core"]' package.json | grep -o '[0-9]\+' | head -1)
          eol=$(curl --fail --silent --retry 3 https://endoflife.date/api/angular.json | jq -r --arg c "$major" '.[] | select(.cycle == $c) | .eol')
          days=$(( ( $(date -d "$eol" +%s) - $(date +%s) ) / 86400 ))
          echo "Angular $major: end of support $eol ($days days left)"
          if [ "$days" -le 30 ]; then
            echo "::error::Angular $major reaches end of support on $eol – upgrade to the next major version (ng update)."
            exit 1
          elif [ "$days" -le 60 ]; then
            echo "::warning::Angular $major reaches end of support on $eol – plan the upgrade."
          fi
