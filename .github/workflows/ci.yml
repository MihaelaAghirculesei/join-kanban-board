name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI

  firestore-rules:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: firestore-tests

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security rules tests (Firestore emulator)
        run: npm test
